name: Docker

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/xayah-graphics/genesia
  PUBLISH: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}

jobs:
  build:
    name: Build CUDA Headless Image
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Free disk space for CUDA layers
        run: |
          sudo rm --recursive --force /usr/share/dotnet /usr/local/lib/android /opt/hostedtoolcache
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        if: env.PUBLISH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
          scope: xayah-graphics/genesia@push

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=tag,enable=${{ env.PUBLISH == 'true' }}
            type=raw,value=latest,enable=${{ env.PUBLISH == 'true' }}
            type=raw,value=ci,enable=${{ env.PUBLISH != 'true' }}

      - name: Build and publish image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: runtime
          pull: true
          platforms: linux/amd64
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          annotations: ${{ steps.metadata.outputs.annotations }}
          outputs: ${{ env.PUBLISH == 'true' && 'type=image,push=true' || 'type=cacheonly' }}
          provenance: ${{ env.PUBLISH == 'true' }}
          sbom: ${{ env.PUBLISH == 'true' }}
          cache-from: type=gha,scope=genesia-docker
          cache-to: type=gha,mode=max,scope=genesia-docker
